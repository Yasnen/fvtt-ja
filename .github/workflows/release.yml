name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# main/v13 を同時にリリースした際、FVTT公式レジストリへの通知が同時に飛んで
# 429 (Too Many Requests) になることがあったため、ブランチをまたいで直列化する。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(jq -r '.version' module.json)
          DOWNLOAD_URL=$(jq -r '.download' module.json)
          EXPECTED_DOWNLOAD="https://github.com/Yasnen/fvtt-ja/archive/refs/tags/v${VERSION}.zip"
          VERIFIED=$(jq -r '.compatibility.verified' module.json)

          if [ "$MODULE_VERSION" != "$VERSION" ]; then
            echo "Error: module.json version ($MODULE_VERSION) != tag ($VERSION)"
            exit 1
          fi
          if [ "$DOWNLOAD_URL" != "$EXPECTED_DOWNLOAD" ]; then
            echo "Error: download URL ($DOWNLOAD_URL) != expected ($EXPECTED_DOWNLOAD)"
            exit 1
          fi
          EXPECTED_VERIFIED="${VERSION%.*}"
          if [ "$VERIFIED" != "$EXPECTED_VERIFIED" ]; then
            echo "Warning: compatibility.verified ($VERIFIED) != $EXPECTED_VERIFIED"
          fi
          echo "OK: $VERSION"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          README_URL="https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/README.md"
          GENERATED=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq '.body')
          NOTES="**変更履歴**: [README.md（${GITHUB_REF_NAME}）](${README_URL})$(printf '\n\n%s' "$GENERATED")"
          gh release create "$GITHUB_REF_NAME" \
            module.json \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES"

      - name: Publish to Foundry VTT
        uses: cs96and/FoundryVTT-release-package@v1.0.3
        with:
          package-token: ${{ secrets.FVTT_PACKAGE_TOKEN }}
          manifest-url: https://github.com/Yasnen/fvtt-ja/releases/download/${{ github.ref_name }}/module.json
          notes-url: https://github.com/Yasnen/fvtt-ja/releases/tag/${{ github.ref_name }}
